apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'jitpack'
        url = 'https://www.jitpack.io'
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    compileOnly "com.cleanroommc:sponge-mixin:0.20.12+mixin.0.8.7"
    if (propertyBool('enable_lwjglx')) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }

    modImplementation "com.github.FormlessDragon:Applied-Energistics-2-Supergiant:v${ae_mod_version}:dev"
    modImplementation "curse.maven:botania-225643:3330934"
    modImplementation "curse.maven:baubles-227083:2518667"

    modCompileOnly "curse.maven:had-enough-items-557549:7938914"
    modCompileOnly "curse.maven:the-one-probe-245211:2667280"
}
